<title>Mis Ahorros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: teléfono = una columna con barra de acción fija abajo; computadora = resumen a la izquierda, meses a la derecha. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14201c; --muted:#5d6b66; --line:#dfe5e2;
  --cash:#1f8a5b; --bnb:#b57d00; --bank:#2f5fd0; --neg:#c2410c; --accent:#14201c; --accent-ink:#ffffff;
  --chip:#e8edeb; --shadow:0 1px 2px rgb(20 32 28 / .06);
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --ink:#e7eeea; --muted:#94a39d; --line:#2a3531;
  --cash:#3fbf86; --bnb:#f0b90b; --bank:#7fa2ff; --neg:#fb8a5a; --accent:#e7eeea; --accent-ink:#0f1513; --chip:#222c28; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --ink:#e7eeea; --muted:#94a39d; --line:#2a3531;
  --cash:#3fbf86; --bnb:#f0b90b; --bank:#7fa2ff; --neg:#fb8a5a; --accent:#e7eeea; --accent-ink:#0f1513; --chip:#222c28; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--bank);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

.app{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start;gap:24px}
  .top{grid-column:1 / -1}
  .col.right{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
  body{padding-bottom:40px}
  .actionbar{display:none}
}

/* encabezado */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tbtn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn.desk{display:none}
@media (min-width:900px){.tbtn.desk{display:inline-flex}}

/* tasas */
.rates{padding:12px;display:flex;flex-direction:column;gap:10px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate{min-width:0;padding:2px 4px}
.rate + .rate{border-left:1px solid var(--line);padding-left:10px}
.rate .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.rate .val{font-size:clamp(16px,4.6vw,21px);font-weight:600;white-space:nowrap}
.rate .unit{font-size:11px;color:var(--muted)}
.rate input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:16px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--bank);font-weight:600;font-size:13px;text-decoration:none}
.status{display:inline-flex;align-items:center;gap:6px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--cash)} .dot.warn{background:var(--bnb)}

/* total */
.hero{padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(36px,10vw,52px);line-height:1.05;letter-spacing:-.02em}
.subs{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--chip);margin-top:6px;gap:2px}
.bar span{display:block;height:100%}

/* bolsillos */
.pockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pocket{padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pocket .name{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.pocket .name i{width:9px;height:9px;border-radius:3px;background:var(--c);display:inline-block}
.pocket .usd{font-size:clamp(16px,4.6vw,20px);font-weight:600;white-space:nowrap}
.pocket .nat{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pocket .pct{font-size:12px;font-weight:600;color:var(--c)}
@media (max-width:420px){
  .pockets{grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .pocket{border:0;border-radius:0;box-shadow:none;display:grid;grid-template-columns:1fr auto;grid-template-areas:"name usd" "nat pct";padding:12px 14px}
  .pocket + .pocket{border-top:1px solid var(--line)}
  .pocket .name{grid-area:name;font-size:14px;color:var(--ink)} .pocket .usd{grid-area:usd;text-align:right}
  .pocket .nat{grid-area:nat} .pocket .pct{grid-area:pct;text-align:right}
}

/* meses */
.panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.months button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.months button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{width:100%;height:160px;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}
.mstat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mstat .v{font-size:16px;font-weight:600;white-space:nowrap}
.pos{color:var(--cash)} .neg{color:var(--neg)}
.mstat{min-width:0}
@media (max-width:480px){
  .mstats{grid-template-columns:1fr;gap:4px}
  .mstat{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
}
.day{flex-wrap:wrap}
.day span:last-child{text-align:right;margin-left:auto}
.list{display:flex;flex-direction:column}
.mov{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mov .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.mov .amt{text-align:right;font-weight:600;white-space:nowrap}
.mov .act{display:flex;gap:12px;justify-content:flex-end}
.mov .act button{background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--muted)}
.mov .act button.danger{color:var(--neg);font-weight:600}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.foot .links{display:flex;gap:14px;flex-wrap:wrap}

/* barra inferior (teléfono) */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px}
.actionbar .primary{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px}
@media (min-width:900px){.actionbar{display:none}}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 4px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.day:first-child{border-top:0;padding-top:0}
.day span:first-child{color:var(--ink)}
.day + .mov{border-top:0}
.goal{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;width:100%}
.goal:focus-visible{outline:2px solid var(--bank);outline-offset:4px;border-radius:6px}
.goal-top{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.gbar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.gbar span{display:block;height:100%;background:var(--ink);border-radius:999px}
.bsbox{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;display:flex;flex-direction:column;gap:4px}
.bsbox .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bsval{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,32px);line-height:1.1;letter-spacing:-.01em}
.addgoal{align-self:flex-start;margin-top:6px}
.mvrow{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.mvrow .cats button{background:var(--surface)}
.amt .to{display:block;color:var(--muted);font-weight:500;font-size:13px}
.preview:empty{display:none}
.pm{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.pm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted);box-sizing:border-box}
.chip[aria-pressed="true"]{border-color:var(--bank);color:var(--bank)}
.chip[aria-pressed="true"]::before{background:var(--bank);border-color:var(--bank);box-shadow:inset 0 0 0 2px var(--surface)}
.pm .seg{background:var(--surface)}
.pm .seg button[aria-pressed="true"]{background:var(--chip)}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}

/* hojas */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px!important}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:var(--chip);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);font-size:16px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cats button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 4px;font-weight:600;font-size:14px}
.cats button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:var(--surface)}
.preview{font-size:13px;color:var(--muted);min-height:18px}
.err{color:var(--neg);font-size:13px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:13px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.guide li b{font-weight:600}
.guide p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="app">
  <header class="top">
    <h1>Mis Ahorros</h1>
    <div class="tools">
      <button class="tbtn" id="install" type="button" hidden>Instalar app</button>
      <button class="tbtn" id="excel" type="button">Excel</button>
      <button class="tbtn" id="guide" type="button">Guía</button>
      <button class="tbtn solid desk" id="add2" type="button">+ Agregar</button>
    </div>
  </header>

  <div class="col left">
    <section class="card rates" aria-label="Tasas del día">
      <div class="rgrid" id="rates"></div>
      <div class="rfoot">
        <span class="status small muted"><span class="dot" id="rdot"></span><span id="rstatus">Cargando tasas…</span></span>
        <span style="display:flex;gap:14px">
          <button class="linkbtn" id="refresh" type="button">Actualizar</button>
          <button class="linkbtn" id="editRates" type="button">Editar</button>
        </span>
      </div>
    </section>

    <section class="card hero" aria-label="Total ahorrado">
      <span class="eyebrow">Total en dólares</span>
      <div class="big num" id="total">$0,00</div>
      <div class="subs num" id="totalSub"></div>
      <div class="bar" id="mix" aria-hidden="true"></div>
      <div id="bsBox"></div>
      <div id="goal"></div>
    </section>

    <section class="pockets" id="pockets" aria-label="Por tipo de ahorro"></section>

    <section class="foot small muted">
      <span id="syncNote"></span>
      <span class="links">
        <button class="linkbtn" id="backup" type="button">Respaldo</button>
        <a class="linkbtn" href="https://www.bcv.org.ve/" target="_blank" rel="noopener">Ver BCV</a>
        <a class="linkbtn" href="https://p2p.binance.com/es/trade/all-payments/USDT?fiat=VES" target="_blank" rel="noopener">Ver Binance P2P</a>
      </span>
    </section>
  </div>

  <div class="col right">
    <section class="card panel" aria-label="Por mes">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h2>Por mes</h2><span class="small muted">Saldo en $ al cierre de cada mes (sin Bs)</span>
      </div>
      <svg class="chart" id="chart" role="img" aria-label="Saldo total al cierre de cada mes"></svg>
      <div class="months" id="months"></div>
      <div class="mstats" id="mstats"></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>

<div class="actionbar">
  <button class="primary" id="add" type="button">+ Agregar movimiento</button>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
const CATS = {
  efectivo:{name:"Efectivo", c:"var(--cash)", def:"USD"},
  binance:{name:"Binance", c:"var(--bnb)", def:"USDT"},
  banco:{name:"Banco", c:"var(--bank)", def:"VES"}
};
const CUR = {USD:"$ (dólares)", USDT:"USDT", EUR:"€ (euros)", VES:"Bs (bolívares)"};
const LS = "mis-ahorros-v1";
const IN_CLAUDE = !!(window.claude && window.claude.use);
const $ = s => document.querySelector(s);
const fmt = (n, d=2) => new Intl.NumberFormat("es-VE",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const money = (n, cur) => { const s=n<0?"−":""; n=Math.abs(n); return cur==="USD" ? s+"$"+fmt(n) : cur==="EUR" ? s+"€"+fmt(n) : cur==="VES" ? s+"Bs "+fmt(n) : s+fmt(n)+" USDT"; };
const ym = d => d.slice(0,7);
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const monthName = k => { const [y,m]=k.split("-"); return new Date(+y, +m-1, 1).toLocaleDateString("es-VE",{month:"short", year:"2-digit"}); };
const monthLong = k => { const [y,m]=k.split("-"); return cap(new Date(+y, +m-1, 1).toLocaleDateString("es-VE",{month:"long", year:"numeric"})); };
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseNum = s => { s=String(s||"").trim().replace(/\s/g,"").replace(/[$€]|Bs|USDT/gi,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,""); const n=parseFloat(s); return isFinite(n)?n:NaN; };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const esc = s => String(s||"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

let state = {movs:[], tasas:{usd:911.62, eur:1009.34, usdt:1071.01, fecha:"2026-11-14T12:00:00Z", origen:"referencia"}, base:"bcv"};
let selMonth = ym(today());
let editingRates = false, pendingDelete = null, dbRef = null;

/* ---------- guardado ---------- */
function loadLocal(){ try{ const raw=localStorage.getItem(LS); if(raw){ const s=JSON.parse(raw); if(s && Array.isArray(s.movs)) state=Object.assign(state,s); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let writing=false, dirty=false, timer=null;
function save(){ saveLocal(); if(!dbRef) return; dirty=true; clearTimeout(timer); timer=setTimeout(flush, 500); }
async function flush(){
  if(writing||!dirty||!dbRef) return;
  writing=true; dirty=false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("cloud"); }
  catch(e){ setSync("local"); }
  writing=false; if(dirty) flush();
}
function setSync(k){
  $("#syncNote").textContent = k==="cloud" ? "Tus datos se guardan en tu cuenta de Claude." :
    "Tus datos se guardan en este teléfono o navegador. Usa Respaldo para pasarlos a otro equipo.";
}
async function connectCloud(){
  setSync("local");
  if(!IN_CLAUDE) return;
  try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    dbRef = db.collection("data/users/"+id).doc("ahorros");
    let first = true;
    const t = setTimeout(()=>{ first=false; }, 10000);
    dbRef.onSnapshot(snap=>{
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      const wasFirst = first;
      if(!snap.metadata || !snap.metadata.fromCache){ first=false; clearTimeout(t); }
      if(snap.exists){
        const d = JSON.parse(JSON.stringify(snap.data()));
        if(Array.isArray(d.movs)){ state = Object.assign({movs:[], tasas:state.tasas, base:"bcv"}, d); saveLocal(); render(); }
        setSync("cloud");
      } else if(wasFirst && !first){
        if(state.movs.length){ dirty=true; flush(); } else setSync("cloud");
      }
    }, ()=>{ clearTimeout(t); dbRef=null; setSync("local"); });
  }catch(e){}
}

/* ---------- tasas ---------- */
async function getJSON(url){
  const ac = new AbortController(); const t=setTimeout(()=>ac.abort(), 8000);
  try{ const r = await fetch(url,{signal:ac.signal, cache:"no-store"}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
let fetching=false;
async function fetchRates(manual){
  if(fetching) return; fetching=true;
  setRStatus("Buscando tasas…","");
  const out = {};
  await Promise.allSettled([
    getJSON("https://ve.dolarapi.com/v1/dolares/oficial").then(j=>{ if(j.promedio) out.usd=+j.promedio; }),
    getJSON("https://ve.dolarapi.com/v1/euros/oficial").then(j=>{ if(j.promedio) out.eur=+j.promedio; }),
    getJSON("https://criptoya.com/api/binancep2p/USDT/VES/1").then(j=>{ const a=+j.ask, b=+j.bid; out.usdt = a&&b ? (a+b)/2 : (a||b); })
      .catch(()=>getJSON("https://ve.dolarapi.com/v1/dolares/paralelo").then(j=>{ if(j.promedio) out.usdt=+j.promedio; }))
  ]);
  fetching=false;
  const got = ["usd","eur","usdt"].filter(k=>out[k]>0);
  if(got.length){
    let changed=false;
    got.forEach(k=>{ const v=Math.round(out[k]*100)/100; if(state.tasas[k]!==v){ state.tasas[k]=v; changed=true; } });
    state.tasas.fecha = new Date().toISOString(); state.tasas.origen="auto";
    if(changed) save(); else saveLocal();
    render();
    setRStatus(got.length===3 ? "En vivo · "+hora(state.tasas.fecha) : "Algunas tasas no cargaron; edítalas", got.length===3?"ok":"warn");
  } else {
    setRStatus(IN_CLAUDE ? "Tasas del "+fechaCorta(state.tasas.fecha)+" · aquí se editan a mano" : "Sin conexión · tasas del "+fechaCorta(state.tasas.fecha), "warn");
    if(manual && IN_CLAUDE) toast("Dentro de Claude las tasas no se actualizan solas. Toca Editar.");
  }
}

/* ---------- cálculos ---------- */
function rateVES(T){ T=T||state.tasas; return state.base==="usdt" ? (T.usdt||T.usd) : T.usd; }
function amtUSD(monto, moneda, T){
  T=T||state.tasas;
  if(moneda==="USD"||moneda==="USDT") return monto;
  if(moneda==="EUR") return T.usd ? monto*T.eur/T.usd : 0;
  const r=rateVES(T); return r ? monto/r : 0;
}
/* Bs que vale una unidad de cada moneda; para sugerir cuánto llega al mover dinero */
function convert(n, from, to){
  if(from===to) return n;
  const T=state.tasas, usdLike=c=>c==="USD"||c==="USDT";
  if(usdLike(from)&&usdLike(to)) return n;
  const bs={VES:1, USD:T.usd, EUR:T.eur, USDT:T.usdt||T.usd};
  return bs[to] ? n*bs[from]/bs[to] : 0;
}
const isMove = m => m.tipo==="mover";
function legs(m){
  if(isMove(m)) return [{cat:m.cat, cur:m.moneda, amt:-m.monto},{cat:m.to, cur:m.moneda2, amt:m.monto2}];
  return [{cat:m.cat, cur:m.moneda, amt:m.tipo==="retiro" ? -(m.monto+(m.comision||0)) : m.monto}];
}
/* Monto con signo; en un retiro incluye la comisión del pago móvil */
const signed = m => m.tipo==="ahorro" ? m.monto : -(m.monto + (m.tipo==="retiro"?(m.comision||0):0));
/* Pago móvil persona a persona: 0,30% del monto, mínimo Bs 14 */
const pmFee = n => Math.max(14, Math.round(n*0.003*100)/100);
const toUSD = m => legs(m).reduce((s,l)=>s+amtUSD(l.amt,l.cur),0);
/* Dólares reales: los Bs NO se suman a los totales en $; se muestran aparte */
const usdLeg = l => l.cur==="VES" ? 0 : amtUSD(l.amt,l.cur);
const dUSD = m => legs(m).reduce((s,l)=>s+usdLeg(l),0);
const dBS = m => legs(m).reduce((s,l)=>s+(l.cur==="VES"?l.amt:0),0);
const sumMoney = (usd,bs) => [Math.abs(usd)>=0.005||!bs?`${usd<0?"":"+"}${money(usd,"USD")}`:"", Math.abs(bs)>=0.005?`${bs<0?"":"+"}${money(bs,"VES")}`:""].filter(Boolean).join(" · ");
/* Valor en $ el día del movimiento (con la tasa guardada ese día) */
const thenUSD = m => m.tasa ? legs(m).reduce((s,l)=>s+amtUSD(l.amt,l.cur,m.tasa),0) : toUSD(m);
const hasFx = m => !!m.tasa && legs(m).some(l=>l.cur==="VES"||l.cur==="EUR");
/* Cuánto han ganado o perdido en $ tus Bs y € desde que los anotaste */
function fxEffect(){
  let s=0, any=false;
  state.movs.forEach(m=>{ if(!m.tasa) return; legs(m).forEach(l=>{ if(l.cur==="VES"||l.cur==="EUR"){ any=true; s+=amtUSD(l.amt,l.cur)-amtUSD(l.amt,l.cur,m.tasa); } }); });
  return any ? s : null;
}
function months(){ const set = new Set(state.movs.map(m=>ym(m.fecha))); set.add(ym(today())); return [...set].sort(); }
function monthlyClose(){
  const run={efectivo:0,binance:0,banco:0}, out=[];
  const sorted=[...state.movs].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let bs=0;
  months().forEach(k=>{ let net=0, netBs=0; sorted.forEach(m=>{ if(ym(m.fecha)===k){ legs(m).forEach(l=>{ run[l.cat]+=usdLeg(l); if(l.cur==="VES") bs+=l.amt; }); if(!isMove(m)){ net+=dUSD(m); netBs+=dBS(m); } } }); out.push({k, v:{...run}, net, netBs, bs}); });
  return out;
}

const norm = v => String(v==null?"":v).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function pick(row, names){ for(const k of Object.keys(row)){ const n=norm(k); if(names.some(x=>n===x)) return row[k]; } return ""; }
function toDate(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  const s=String(v||"").trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return "";
}
function toCat(v){ const n=norm(v); if(n.includes("efect")) return "efectivo"; if(n.includes("binan")) return "binance"; if(n.includes("banc")) return "banco"; return ""; }
function toCur(v){ const n=norm(v).replace(/\s/g,""); if(!n) return ""; if(n==="usdt") return "USDT"; if(n==="$"||n==="usd"||n.startsWith("dolar")) return "USD"; if(n==="€"||n==="eur"||n.startsWith("euro")) return "EUR"; if(n==="bs"||n==="ves"||n.startsWith("bol")) return "VES"; return ""; }
const toNum = v => typeof v==="number" ? v : parseNum(v);
async function importExcel(file){
  const out=$("#x-out"); out.innerHTML=`<span class="small muted">Leyendo el archivo…</span>`;
  let X; try{ X=await loadXLSX(); }catch(e){ out.innerHTML=`<div class="err">No se pudo abrir el lector de Excel. Revisa tu conexión e intenta de nuevo.</div>`; return; }

    }

    <div class="row2"><button class="ghost" type="button" data-close>Cancelar</button><button class="primary" type="button" id="x-ok">Reemplazar</button></div>
  </div>`;
  $("#x-ok").onclick=()=>{ state.movs=movs; save(); closeSheet(); render(); toast("Excel importado: "+movs.length+" movimientos"); };

/* Ancho de columna según el contenido: el encabezado puede bajar de línea, los datos no se cortan */
function xWidth(c, rows){
  const longestWord = Math.max(...String(c.h).split(/\s+/).map(w=>w.length));
  let w = Math.max(longestWord+2, Math.ceil(String(c.h).length/2)+2);
  rows.forEach(r=>{ const v=r[c.h]; if(v===""||v==null) return;
    const len = typeof v==="number" ? fmt(v).length+6 : String(v).length+2;
    w=Math.max(w,len); });
  return Math.min(c.max||45, Math.max(c.min||9, w));
}
function xTable(ws, cols, rows, each){

  rows.forEach((r,i)=>{

    for(let ci=1; ci<=cols.length; ci++){ const cell=row.getCell(ci), c=cols[ci-1]; if(c.fmt) cell.numFmt=c.fmt; cell.border=xline; if(i%2) cell.fill=xfill(XC.bg);
      cell.alignment={vertical:"middle", wrapText:true, horizontal: typeof r[c.h]==="number" ? "right" : "left"}; }

  for(let r=4;r<=7;r++) for(let c=2;c<=6;c++){ d.getCell(r,c).fill=xfill(c<=4?XC.efectivo.t:XC.banco.t); }
  d.mergeCells("B4:D4"); d.getCell("B4").value="TOTAL EN DÓLARES"; d.getCell("B4").font={bold:true,size:9,color:{argb:XC.muted}};
  d.mergeCells("E4:F4"); d.getCell("E4").value="TOTAL EN BOLÍVARES"; d.getCell("E4").font={bold:true,size:9,color:{argb:XC.muted}};
  d.mergeCells("B5:D6"); const tv=d.getCell("B5"); tv.value=r2(total); tv.numFmt=XF.USD; tv.font={bold:true,size:26,color:{argb:XC.ink}}; tv.alignment={vertical:"middle",horizontal:"left"};
  d.mergeCells("E5:F6"); const bv=d.getCell("E5"); bv.value=hasBs?r2(bsTot):"Sin bolívares"; if(hasBs) bv.numFmt=XF.VES; bv.font={bold:true,size:hasBs?20:12,color:{argb:hasBs?XC.banco.c:XC.muted}}; bv.alignment={vertical:"middle",horizontal:"left"};
  d.mergeCells("B7:D7"); d.getCell("B7").value=`≈ €${fmt(T.usd&&T.eur?total*T.usd/T.eur:0)} · Brecha BCV y Binance ${fmt(T.usd?(T.usdt/T.usd-1)*100:0,1)}%`; d.getCell("B7").font={size:9,color:{argb:XC.muted}}; d.getCell("B7").alignment={wrapText:true,vertical:"top"};
  d.mergeCells("E7:F7"); d.getCell("E7").value=hasBs?`≈ ${money(amtUSD(bsTot,"VES"),"USD")} a tasa ${state.base==="usdt"?"Binance":"BCV"} · solo referencia${fx!==null&&Math.abs(fx)>=0.01?` · por la tasa ${fx<0?"perdieron":"ganaron"} ${money(Math.abs(fx),"USD")}`:""}`:"";
  d.getCell("E7").font={size:9,color:{argb:XC.muted}}; d.getCell("E7").alignment={wrapText:true,vertical:"top"}; d.getRow(7).height=36;
  d.pageSetup={orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}};
  [5,6].forEach(r=>d.getRow(r).height=22);

  let r=9;
  const section=(title)=>{ d.mergeCells(r,2,r,6); const c=d.getCell(r,2); c.value=title; c.font={bold:true,size:12,color:{argb:XC.ink}}; c.border={bottom:{style:"medium",color:{argb:XC.ink}}}; d.getRow(r).height=22; r++; };
  const head=(labels)=>{ labels.forEach((t,i)=>{ const c=d.getCell(r,2+i); c.value=t; c.font={bold:true,size:9,color:{argb:XC.muted}}; c.border=xline; }); r++; };

  // meta
  const g=state.meta;
  if(g&&g.monto>0){
    section("Meta de ahorro");
    const p=Math.max(0,total/g.monto), falta=g.monto-total;
    d.getCell(r,2).value=g.nombre||"Meta"; d.getCell(r,2).font={bold:true}; d.getCell(r,2).alignment={wrapText:true,vertical:"middle"};
    d.getCell(r,3).value=r2(g.monto); d.getCell(r,3).numFmt=XF.USD;
    d.getCell(r,4).value=p; d.getCell(r,4).numFmt=XF.pct; d.getCell(r,4).font={bold:true,color:{argb:falta>0?XC.ink:XC.pos}};
    d.getCell(r,5).value=xbar(p); d.getCell(r,5).font={color:{argb:falta>0?XC.ink:XC.pos}};
    d.getCell(r,6).value=falta>0?`Faltan ${money(falta,"USD")}${g.fecha?" para "+monthLong(ym(g.fecha)).toLowerCase():""}`:`¡Cumplida! La superaste por ${money(-falta,"USD")}`;
    d.getCell(r,6).font={size:10,color:{argb:falta>0?XC.muted:XC.pos}}; d.getCell(r,6).alignment={wrapText:true,vertical:"middle"}; d.getRow(r).height=30;
    r+=2;
  }

  // bolsillos
  section("Por bolsillo (en dólares)");
  head(["Bolsillo","En dólares","% de tus $","","Detalle por moneda"]);
  Object.entries(CATS).forEach(([k,c])=>{
    const col=XC[k], p=total>0?byCat[k]/total:0;
    const nm=d.getCell(r,2); nm.value="● "+c.name; nm.font={bold:true,color:{argb:col.c}}; nm.fill=xfill(col.t);
    d.getCell(r,3).value=r2(byCat[k]); d.getCell(r,3).numFmt=XF.USD; d.getCell(r,3).font={bold:true};
    d.getCell(r,4).value=p; d.getCell(r,4).numFmt=XF.pct; d.getCell(r,4).font={color:{argb:col.c},bold:true};
    d.getCell(r,5).value=xbar(p); d.getCell(r,5).font={color:{argb:col.c}};
    d.getCell(r,6).value=Object.entries(nat[k]).filter(([,v])=>Math.abs(v)>0.004).map(([cur,v])=>money(v,cur)).join(" · ")||"Sin movimientos";
    d.getCell(r,6).font={size:10,color:{argb:XC.muted}}; d.getCell(r,6).alignment={wrapText:true,vertical:"middle"};
    for(let cc=2;cc<=6;cc++){ d.getCell(r,cc).border=xline; if(cc<6) d.getCell(r,cc).alignment={vertical:"middle"}; } d.getRow(r).height=22; r++;
  });
  d.getCell(r,2).value="Total"; d.getCell(r,2).font={bold:true};
  d.getCell(r,3).value=r2(total); d.getCell(r,3).numFmt=XF.USD; d.getCell(r,3).font={bold:true};
  if(hasBs){ d.getCell(r,6).value=`+ ${money(bsTot,"VES")} aparte`; d.getCell(r,6).font={bold:true,color:{argb:XC.banco.c}}; }
  r+=2;

  // meses
  section("Por mes");
  head(["Mes","Ahorro neto $","Bs del mes","Saldo $ al cierre",""]);
  const maxC=Math.max(1,...closes.map(c=>c.v.efectivo+c.v.binance+c.v.banco));
  [...closes].reverse().slice(0,12).forEach(c=>{
    const tot=c.v.efectivo+c.v.binance+c.v.banco;
    d.getCell(r,2).value=monthLong(c.k);
    d.getCell(r,3).value=r2(c.net); d.getCell(r,3).numFmt=XF.USD; d.getCell(r,3).font={color:{argb:c.net<0?XC.neg:XC.pos},bold:true};
    d.getCell(r,4).value=c.netBs?r2(c.netBs):""; d.getCell(r,4).numFmt=XF.VES; d.getCell(r,4).font={color:{argb:XC.banco.c}};
    d.getCell(r,5).value=r2(tot); d.getCell(r,5).numFmt=XF.USD; d.getCell(r,5).font={bold:true};
    d.getCell(r,6).value=xbar(tot/maxC,22); d.getCell(r,6).font={color:{argb:XC.pos}};
    for(let cc=2;cc<=6;cc++) d.getCell(r,cc).border=xline; r++;
  });
  r++;

  // tasas
  section("Tasas usadas");
  [["Dólar BCV",T.usd,"Bs por $"],["Euro BCV",T.eur,"Bs por €"],["USDT Binance P2P",T.usdt,"Bs por USDT"]].forEach(([n,v,u])=>{
    d.getCell(r,2).value=n; d.getCell(r,3).value=v; d.getCell(r,3).numFmt=XF.num; d.getCell(r,3).font={bold:true}; d.getCell(r,4).value=u; d.getCell(r,4).font={size:9,color:{argb:XC.muted}};
    for(let cc=2;cc<=4;cc++) d.getCell(r,cc).border=xline; r++;
  });
  d.getCell(r,2).value=`Actualizadas: ${new Date(T.fecha).toLocaleString("es-VE")}`; d.getCell(r,2).font={size:9,italic:true,color:{argb:XC.muted}};

  /* ---- Hoja 2: Movimientos (se puede editar y volver a subir) ---- */
  const mv=wb.addWorksheet("Movimientos",{properties:{tabColor:{argb:XC.ink}}});
  const movRows=sorted.map(m=>({
    "Fecha": m.fecha, "Mes": monthLong(ym(m.fecha)), "Dónde": isMove(m)?`${CATS[m.cat].name} → ${CATS[m.to].name}`:CATS[m.cat].name,
    "Tipo": isMove(m)?"Mover":m.tipo==="retiro"?"Retiro":"Ahorro",
    "Moneda": cn(m.moneda), "Monto": r2(m.tipo==="retiro" ? -m.monto : signed(m)),
    "Pago móvil": m.pm ? (m.pm==="sin" ? "Sí, sin comisión" : "Sí, con comisión") : "", "Comisión (Bs)": m.pm ? r2(m.comision||0) : "",
    "Llega": isMove(m)?r2(m.monto2):"", "Moneda que llega": isMove(m)?cn(m.moneda2):"",
    "Tasa $ BCV ese día": m.tasa?m.tasa.usd:"", "Tasa € BCV ese día": m.tasa?m.tasa.eur:"", "Tasa Binance ese día": m.tasa?m.tasa.usdt:"",
    "En $ ese día": hasFx(m)?r2(thenUSD(m)):"", "Aprox. en $ hoy": r2(toUSD(m)), "Nota": m.nota||""
  }));
  xTable(mv,[{h:"Fecha",min:12},{h:"Mes"},{h:"Dónde"},{h:"Tipo"},{h:"Moneda"},{h:"Monto",min:14},{h:"Pago móvil"},{h:"Comisión (Bs)",fmt:XF.VES},{h:"Llega"},{h:"Moneda que llega"},
    {h:"Tasa $ BCV ese día",fmt:XF.num},{h:"Tasa € BCV ese día",fmt:XF.num},{h:"Tasa Binance ese día",fmt:XF.num},{h:"En $ ese día",fmt:XF.USD},{h:"Aprox. en $ hoy",fmt:XF.USD},{h:"Nota",min:24,max:40}],
    movRows,(row,i)=>{
      const m=sorted[i], col=XC[isMove(m)?"mover":m.cat];
      const dn=row.getCell(3); dn.fill=xfill(col.t); dn.font={bold:true,color:{argb:col.c}};
      row.getCell(4).font={bold:true,color:{argb:isMove(m)?XC.muted:m.tipo==="retiro"?XC.neg:XC.pos}};
      row.getCell(6).numFmt=XF[m.moneda]||XF.num; row.getCell(6).font={bold:true};
      if(m.pm) row.getCell(7).font={color:{argb:XC.banco.c}};
      if(isMove(m)) row.getCell(9).numFmt=XF[m.moneda2]||XF.num;
    });

  /* ---- Hoja 3: Resumen por mes ---- */
  const rm=wb.addWorksheet("Resumen por mes",{properties:{tabColor:{argb:XC.efectivo.c}}});
  xTable(rm,[{h:"Mes",w:18},{h:"Ahorro neto del mes $",w:16,fmt:XF.USD},{h:"Bolívares del mes (Bs)",w:18,fmt:XF.VES},{h:"Efectivo $",w:14,fmt:XF.USD},{h:"Binance $",w:14,fmt:XF.USD},{h:"Banco $",w:14,fmt:XF.USD},{h:"Total en $ al cierre",w:16,fmt:XF.USD},{h:"Total en Bs al cierre",w:18,fmt:XF.VES}],
    closes.map(c=>({ "Mes": monthLong(c.k), "Ahorro neto del mes $": r2(c.net), "Bolívares del mes (Bs)": r2(c.netBs),
      "Efectivo $": r2(c.v.efectivo), "Binance $": r2(c.v.binance), "Banco $": r2(c.v.banco), "Total en $ al cierre": r2(c.v.efectivo+c.v.binance+c.v.banco), "Total en Bs al cierre": r2(c.bs) })),
    row=>{ [4,5,6].forEach((ci,j)=>row.getCell(ci).font={color:{argb:XC[["efectivo","binance","banco"][j]].c}}); row.getCell(7).font={bold:true}; row.getCell(8).font={bold:true,color:{argb:XC.banco.c}}; });
  ["D1","E1","F1"].forEach((a,j)=>rm.getCell(a).fill=xfill(XC[["efectivo","binance","banco"][j]].c));

  /* ---- Hoja 4: Resumen por día ---- */
  const dias={}; state.movs.forEach(m=>{ const k=m.fecha; dias[k]=dias[k]||{efectivo:0,binance:0,banco:0,bs:0}; legs(m).forEach(l=>{ dias[k][l.cat]+=usdLeg(l); if(l.cur==="VES") dias[k].bs+=l.amt; }); });
  let acc=0, accBs=0;
  const dia=Object.keys(dias).sort().map(k=>{ const v=dias[k], n=v.efectivo+v.binance+v.banco; acc+=n; accBs+=v.bs;
    return {"Fecha":k,"Día":cap(new Date(k+"T12:00").toLocaleDateString("es-VE",{weekday:"long"})),"Efectivo $":r2(v.efectivo),"Binance $":r2(v.binance),"Banco $":r2(v.banco),"Neto del día $":r2(n),"Total acumulado $":r2(acc),"Bs del día":r2(v.bs),"Total acumulado Bs":r2(accBs)}; });
  const rd=wb.addWorksheet("Resumen por día",{properties:{tabColor:{argb:XC.binance.c}}});
  xTable(rd,[{h:"Fecha",w:12},{h:"Día",w:12},{h:"Efectivo $",w:14,fmt:XF.USD},{h:"Binance $",w:14,fmt:XF.USD},{h:"Banco $",w:14,fmt:XF.USD},{h:"Neto del día $",w:14,fmt:XF.USD},{h:"Total acumulado $",w:16,fmt:XF.USD},{h:"Bs del día",w:16,fmt:XF.VES},{h:"Total acumulado Bs",w:18,fmt:XF.VES}],
    dia,row=>{ [3,4,5].forEach((ci,j)=>row.getCell(ci).font={color:{argb:XC[["efectivo","binance","banco"][j]].c}}); row.getCell(7).font={bold:true}; row.getCell(9).font={bold:true,color:{argb:XC.banco.c}}; });
  ["C1","D1","E1"].forEach((a,j)=>rd.getCell(a).fill=xfill(XC[["efectivo","binance","banco"][j]].c));

  /* ---- Hoja 5: Tasas ---- */
  const tas=[{"Tasa":"Dólar BCV (Bs por $)","Valor":T.usd},{"Tasa":"Euro BCV (Bs por €)","Valor":T.eur},{"Tasa":"USDT Binance P2P (Bs por USDT)","Valor":T.usdt},
    {"Tasa":"Aproximado de Bs en $ calculado con","Valor":state.base==="usdt"?"Binance":"BCV"},{"Tasa":"Fecha de las tasas","Valor":new Date(T.fecha).toLocaleString("es-VE")}];
  if(g&&g.monto) tas.push({"Tasa":"Meta de ahorro ($)","Valor":g.monto},{"Tasa":"Fecha de la meta","Valor":g.fecha||"Sin fecha"});
  const ts=wb.addWorksheet("Tasas",{properties:{tabColor:{argb:XC.muted}}});
  xTable(ts,[{h:"Tasa",w:36},{h:"Valor",w:24}],tas,row=>{ if(typeof row.getCell(2).value==="number") row.getCell(2).numFmt=XF.num; row.getCell(2).font={bold:true}; });
  ts.autoFilter=undefined;

  const buf=await wb.xlsx.writeBuffer();
  const name="mis-ahorros-"+today()+".xlsx";
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  if(IN_CLAUDE){
    try{ const dl=await claude.use("downloads"); if(!dl) throw {code:"unavailable"}; await dl.save({filename:name,data:blob}); toast("Excel guardado"); }
    catch(e){ toast(e&&e.code==="declined" ? "Descarga cancelada" : "Aquí no se puede descargar. Abre la app desde su página propia."); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("Excel descargado");
}

function loadDemo(){
  const d=new Date(), k=(o,day)=>{ const x=new Date(d.getFullYear(), d.getMonth()-o, Math.min(day, o===0?d.getDate():28)); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
  const rows=[[3,5,"efectivo","ahorro","USD",120,"Quincena"],[3,18,"binance","ahorro","USDT",80,"Compra P2P"],[3,20,"banco","ahorro","VES",15000,"Pago móvil"],
    [2,4,"efectivo","ahorro","USD",100,"Quincena"],[2,22,"binance","ahorro","USDT",150,""],[2,27,"efectivo","retiro","USD",40,"Mercado"],
    [1,6,"banco","ahorro","VES",22000,"Sueldo"],[1,15,"binance","ahorro","USDT",100,""],[1,28,"efectivo","ahorro","USD",60,""],
    [0,1,"efectivo","ahorro","USD",80,"Quincena"],[0,1,"binance","retiro","USDT",30,"Pago"]];
  state.movs = rows.map(r=>({id:uid(),t:Date.now(),fecha:k(r[0],r[1]),cat:r[2],tipo:r[3],moneda:r[4],monto:r[5],nota:r[6],demo:true}));
  save(); render(); toast("Datos de ejemplo cargados. Puedes borrarlos en Respaldo.");
}
function toast(t){ $("#toastHost").innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>$("#toastHost").innerHTML="",2600); }

/* ---------- eventos ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; $("#install").hidden=false; });
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-m]"); if(!el) return;
  const id=el.id, d=el.dataset;
  if(id==="add"||id==="add2") openForm();
  else if(id==="demo") loadDemo();
  else if(id==="backup") openBackup();
  else if(id==="guide") openGuide();
  else if(id==="excel") openExcel();
  else if(id==="goalBtn") openGoal();
  else if(id==="install"&&installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; $("#install").hidden=true; }); }
  else if(id==="refresh") fetchRates(true);
  else if(id==="editRates"){
    if(editingRates){
      const v={}; let ok=true;
      ["usd","eur","usdt"].forEach(k=>{ const n=parseNum($("#rate-"+k).value); if(n>0) v[k]=n; else ok=false; });
      if(!ok){ setRStatus("Escribe las tres tasas, por ejemplo 911,62","warn"); return; }
      Object.assign(state.tasas, v, {fecha:new Date().toISOString(), origen:"manual"});
      editingRates=false; save(); render(); setRStatus("Escritas a mano · "+hora(state.tasas.fecha),"ok");
    } else { editingRates=true; renderRates(); const i=$("#rate-usd"); if(i) i.focus(); }
  }
  else if(d.base){ state.base=d.base; save(); render(); }
  else if(d.m){ selMonth=d.m; pendingDelete=null; renderChart(); renderMonth(); }
  else if(d.edit){ const m=state.movs.find(x=>x.id===d.edit); if(m) openForm(m); }
  else if(d.ask){ pendingDelete=d.ask; renderMonth(); }
  else if(el.hasAttribute("data-cancel")){ pendingDelete=null; renderMonth(); }
  else if(d.del){ state.movs=state.movs.filter(x=>x.id!==d.del); pendingDelete=null; save(); render(); toast("Movimiento borrado"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(renderChart,150); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && Date.now()-new Date(state.tasas.fecha).getTime()>10*60e3) fetchRates(); });
setInterval(()=>{ if(!document.hidden) fetchRates(); }, 10*60e3);

loadLocal();
render();
setRStatus("Tasas del "+fechaCorta(state.tasas.fecha),"");
fetchRates();
connectCloud();
})();
</script>
